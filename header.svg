    <text x="70" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#CBD5E1">Backend Engineer · Distributed Systems · Java · System Design</text>
    <text x="70" y="235" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#38BDF8">&gt; building engineering-atlas.in · Bengaluru, India</text>
