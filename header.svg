      <circle cx="830" cy="80" r="14" stroke="#38BDF8"/>
      <circle cx="960" cy="60" r="14" stroke="#A3E635"/>
      <circle cx="1090" cy="110" r="14" stroke="#38BDF8"/>
      <circle cx="1000" cy="200" r="14" stroke="#A78BFA"/>
      <circle cx="870" cy="215" r="14" stroke="#A3E635"/>
    </g>
    <circle r="5" fill="#A3E635"><animateMotion dur="6s" repeatCount="indefinite" path="M830 80L960 60L1090 110L1000 200L870 215Z"/></circle>
    <circle r="5" fill="#38BDF8"><animateMotion dur="4s" repeatCount="indefinite" path="M960 60L1000 200L870 215L1090 110Z"/></circle>
    </g><text x="70" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#F8FAFC">Abhishek Goyal</text>
