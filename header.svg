    <rect width="1200" height="300" fill="url(#grid)"/>
    <g transform="translate(40 0)"><g stroke="#38BDF8" stroke-opacity="0.45" stroke-width="2" fill="none">
      <path d="M830 80L960 60L1090 110L1000 200L870 215L830 80M960 60L1000 200M870 215L1090 110"/>
    </g>
