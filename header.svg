<svg width="600" height="120" viewBox="0 0 600 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E7FFF"/>
      <stop offset="50%" stop-color="#0066E0"/>
      <stop offset="100%" stop-color="#3D9BFF"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" opacity="0.35"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="600" height="120" rx="14"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="600" height="120" fill="url(#bgGradient)"/>

    <!-- Dot pattern accents, left and right -->
    <rect x="0" y="0" width="130" height="120" fill="url(#dots)"/>
    <rect x="470" y="0" width="130" height="120" fill="url(#dots)"/>

    <!-- Soft highlight -->
    <ellipse cx="300" cy="10" rx="320" ry="60" fill="#FFFFFF" opacity="0.06"/>
  </g>

  <!-- Border -->
  <rect x="1" y="1" width="598" height="118" rx="14" fill="none" stroke="#FFFFFF" stroke-opacity="0.15"/>

  <!-- Name -->
  <text x="300" y="56" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">
    Abhishek Goyal
  </text>

  <!-- Subtitle -->
  <text x="300" y="82" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#EAF3FF" opacity="0.95">
    Software Engineer II @ Fivetran · Backend &amp; Distributed Systems · Bengaluru
  </text>
</svg>
